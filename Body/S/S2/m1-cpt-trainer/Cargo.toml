[package]
name = "epi-s2-m1-cpt-trainer"
version = "0.1.0"
edition = "2021"
description = "M1' Paramaśiva CPT trainer — EKSFT loss with epistemic-blindfolded teacher distillation, per Phase-I DiscoverAI research synthesis wave-2 scout 4"

[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[[bin]]
name = "m1-cpt-train"
path = "src/main.rs"
