[package]
name = "epi-s2-graph-services"
version = "0.1.0"
edition = "2021"
description = "S2 graph service contracts for Neo4j and Redis-backed semantic cache"
license = "MIT OR Apache-2.0"

[lib]
name = "epi_s2_graph_services"
path = "src/lib.rs"

[dependencies]
# Track 53 T53.06: the last two S2→S3 edges are gone. `epi-s3-gateway-contract`
# and `epi-s3-redis-context` were carried here only to quote declarations about
# the S2/S3 boundary — the Redis residency role, the tier vocabulary, the
# connection descriptor, the RedisVL bridge path, the Graphiti authority. Those
# now live at `epi-kernel-contract`, below both layers, and S3 re-exports them.
# The doctor's Redis probe uses `redis` directly, because raw Redis is S2's own
# shared infrastructure.
epi-s2-graph-schema = { path = "../graph-schema" }
epi-kernel-contract = { path = "../../epi-kernel-contract" }
gemini-embedding = { path = "../../S0/gemini-embedding" }
portal-core = { path = "../../S0/portal-core" }
neo4rs = "0.9.0-rc.9"
chrono = "0.4"
redis = { version = "0.25", features = ["tokio-comp"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
epi-s1-hen-compiler-core = { path = "../../S1/hen-compiler-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
