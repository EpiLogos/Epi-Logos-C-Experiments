# M2 aspect-engine behavioral knobs — Track 38 unified surface drain
# (2026-07-19 audit). Angles 0/60/90/120/180 are LAW (structural, never
# tunable); the ORBS are behavioral detection windows. Defaults equal the
# former ASPECT_ANGLES orb constants. Consumption wiring flagged per
# Track 38 §8 gating.

[[tunable]]
key = "m2.aspect.orb.conjunction"
type = "f32"
default = 10.0
residency_class = "freeze-on-session-start"
scope_class = "global"
tuning_risk_class = "B"
ml_trainable = false
privacy_class = "non-sensitive"
owning_subsystem = "M2"
authoritative_doc = "aspect.rs ASPECT_ANGLES orbs"
[tunable.range]
min = 1.0
max = 15.0

