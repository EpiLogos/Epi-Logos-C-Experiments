privacy_class = "non-sensitive"
owning_subsystem = "M3"
owning_carrier = "hen"
authoritative_doc = "Tranche CCT-14b"
[tunable.range]
enum_values = ["blake3_first_6_bits", "blake3_modulo_64", "blake3_xor_fold"]

