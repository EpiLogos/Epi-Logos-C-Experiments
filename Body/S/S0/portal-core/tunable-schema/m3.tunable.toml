# M3 lens-field tunables — Track 38 unified surface (Architect ruling 2026-07-19:
# "one unified and clean tunability surface, applied across the tunable metrics
# in full"). Consumption: parameter-injection at the boundary (kernel stays
# registry-free); the lensField dispatch arm and the cast-time reading read this.

[[tunable]]
key = "m3.lens_field.akasha_balance_epsilon"
type = "f32"
default = 0.05
residency_class = "freeze-on-session-start"
scope_class = "global"
tuning_risk_class = "A"
ml_trainable = false
privacy_class = "non-sensitive"
structural_invariant = false
owning_subsystem = "M3"
owning_carrier = "anima"
authoritative_doc = "pleroma-30-syzygy-lens6-integration.md + 02-16-lenses Generic Lens-Field Dynamic"
warrant_constants = []
description = "Maximum deviation of any normalized element weight from the balanced 0.25 for the Akasha/Quintessence balance condition (generic lens-field law; honest-null when kairos unpositioned)."
[tunable.range]
min = 0.005
max = 0.25
