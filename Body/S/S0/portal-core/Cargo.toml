[package]
name = "portal-core"
version = "0.1.0"
edition = "2021"
description = "Pure math types and functions for the Epi-Logos portal clock — shared by epi-cli and epi-tauri"
license = "MIT OR Apache-2.0"

[dependencies]
epi-lib = { path = "../epi-lib", features = ["m0_verifier"] }
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[features]
default = []
resonance_ebm_runtime = []

[dev-dependencies]
serde_json = "1"
tempfile = "3"
