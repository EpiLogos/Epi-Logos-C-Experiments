[package]
name = "portal-core"
version = "0.1.0"
edition = "2021"
description = "Pure math types and functions for the Epi-Logos portal clock — shared by epi-cli and epi-tauri"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ql-core = { git = "https://github.com/EpiLogos/QL-MEF", rev = "ed754d1cd65d92b54620f4305145970b84c3b53f" }
ql-mef = { git = "https://github.com/EpiLogos/QL-MEF", rev = "ed754d1cd65d92b54620f4305145970b84c3b53f" }

[dev-dependencies]
serde_json = "1"
