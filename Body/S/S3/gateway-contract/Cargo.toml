[package]
name = "epi-s3-gateway-contract"
version = "0.1.0"
edition = "2021"
description = "S3 gateway protocol and method contract for Epi-Logos"
license = "MIT OR Apache-2.0"

[lib]
name = "epi_s3_gateway_contract"
path = "src/lib.rs"

[dependencies]
# S3 -> S1 is DOWNWARD and legal (the S3 row forbids only S4/S5). Track 53
# T53.04 moved the `s1'.*` contract shapes to their owning coordinate; this
# crate re-exports them so every existing import path still resolves.
epi-s1-hen-compiler-core = { path = "../../S1/hen-compiler-core" }
epi-kernel-contract = { path = "../../epi-kernel-contract" }
portal-core = { path = "../../S0/portal-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4"] }
