[package]
name = "epi-s3-gateway"
version = "0.1.0"
edition = "2021"
description = "S3 gateway runtime primitives for sessions, transcripts, workspace scope, and product gateway parity"
license = "MIT OR Apache-2.0"

[lib]
name = "epi_s3_gateway"
path = "src/lib.rs"

[dependencies]
epi-s3-gateway-contract = { path = "../gateway-contract" }
epi-kernel-contract = { path = "../../epi-kernel-contract" }
epi-s3-redis-context = { path = "../redis-context" }
# S3 -> S2 is DOWNWARD and legal (the S3 row forbids only S4/S5). Track 53
# T53.06 brought the S3' temporal law home from epi-cli; its best-effort graph
# revision stamp reads S2's graph meta, which is S2's to answer.
epi-s2-graph-services = { path = "../../S2/graph-services" }
portal-core = { path = "../../S0/portal-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `rt` + `time`: the relocated hydration bridge builds a current-thread runtime
# when it is called from blocking code, and bounds the graph-meta read at 750ms.
tokio = { version = "1", features = ["process", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

# 13.T4: SpaceTimeDB native subscription / HTTP reducer client / fallback policy
# all live in the S3 spacetime module tree (gateway/src/spacetime/). These deps
# previously belonged to S0; moving them here decouples the membrane.
futures-util = "0.3"
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", features = ["json", "blocking"] }
sha2 = "0.10"
blake3 = "1"
hex = "0.4"

[dev-dependencies]
epi-s3-graphiti-runtime = { path = "../graphiti-runtime" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "sync"] }
