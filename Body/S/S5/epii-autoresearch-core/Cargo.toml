[package]
name = "epi-s5-epii-autoresearch-core"
version = "0.1.0"
edition = "2021"

[dependencies]
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
epi-s1-hen-compiler-core = { path = "../../S1/hen-compiler-core" }
epi-s2-graph-services = { path = "../../S2/graph-services" }
epi-s5-epii-review-core = { path = "../epii-review-core" }
portal-core = { path = "../../S0/portal-core" }
# S5 -> S-root is DOWNWARD and legal. This is the method-handler port S5
# implements so S3 can route `s5'.improve.*` / `s5'.tune.*` here without
# importing S5's implementation (Track 53 T53.01/T53.08).
epi-kernel-contract = { path = "../../epi-kernel-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[features]
default = []
resonance_ebm = ["dep:candle-core", "dep:candle-nn"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
