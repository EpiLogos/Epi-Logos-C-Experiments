[package]
name = "epi-s5-epii-review-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# S5 -> S-root is DOWNWARD and legal. This is the method-handler port S5
# implements so S3 can route `s5'.review.*` here without importing S5's
# implementation (Track 53 T53.01/T53.08).
epi-kernel-contract = { path = "../../epi-kernel-contract" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
