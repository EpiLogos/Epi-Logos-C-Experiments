name: M2 relation-plan test fix

on:
  push:
    branches:
      - work/w1-ananda-substrate
    paths:
      - '.github/workflows/m2-plan-test-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/w1-ananda-substrate
      - name: Use native kernel clock constructor and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Body/S/S0/portal-core/src/parashakti/relation_plan.rs')
          s = p.read_text()
          old = '''    use crate::kernel::{KernelPhase, KernelTick};\n\n    fn profile(tick12: u8) -> MathemeHarmonicProfile {\n        MathemeHarmonicProfile::from_tick(KernelTick {\n            cycle: 0,\n            sub_tick: tick12,\n            phase: if tick12 < 6 {\n                KernelPhase::Descent\n            } else {\n                KernelPhase::Ascent\n            },\n            element: crate::kernel::KernelElement::from_position(tick12 % 6),\n            position6: tick12 % 6,\n            harmonic_ratio: 1.0,\n        })\n    }'''
          new = '''    use crate::kernel::kernel_tick_from_epogdoon;\n\n    fn profile(tick12: u8) -> MathemeHarmonicProfile {\n        MathemeHarmonicProfile::from_tick(kernel_tick_from_epogdoon(0, tick12))\n    }'''
          if old not in s:
              raise SystemExit('expected test profile helper not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo test --manifest-path Body/S/S0/portal-core/Cargo.toml
      - name: Commit verified source fix
        run: |
          git config user.name "Epii"
          git config user.email "frank.g.taylor97@gmail.com"
          git add Body/S/S0/portal-core/src/parashakti/relation_plan.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix(m2): construct relation-plan tests from native clock"
          git push origin HEAD:work/w1-ananda-substrate
