name: M1 Ananda substrate

on:
  push:
    branches:
      - work/w1-ananda-substrate
    paths:
      - 'Makefile'
      - 'Body/S/S0/epi-lib/include/m1.h'
      - 'Body/S/S0/epi-lib/include/m1_ananda_projection.h'
      - 'Body/S/S0/epi-lib/include/pointer_web.h'
      - 'Body/S/S0/epi-lib/src/m1.c'
      - 'Body/S/S0/epi-lib/src/m1_ananda_projection.c'
      - 'Body/S/S0/epi-lib/src/pointer_web.c'
      - 'Body/S/S0/epi-lib/test/m1/**'
      - 'Body/S/S0/epi-lib/test/infrastructure/test_pointer_web.c'
      - 'Body/S/S0/portal-core/Cargo.toml'
      - 'Body/S/S0/portal-core/Cargo.lock'
      - 'Body/S/S0/portal-core/src/hopf.rs'
      - 'Body/S/S0/portal-core/src/kernel.rs'
      - 'Body/S/S0/portal-core/src/lib.rs'
      - 'Body/S/S0/portal-core/src/ananda_vortex.rs'
      - 'Body/S/S0/portal-core/src/ananda_music_bridge.rs'
      - 'Body/S/S0/portal-core/src/ananda_ratio_basis.rs'
      - 'Body/S/S0/portal-core/src/ananda_ql_bridge.rs'
      - 'Body/S/S0/portal-core/tests/kernel_clock_projection.rs'
      - 'Body/S/S0/portal-core/tests/ananda_vortex_projection.rs'
      - '.github/workflows/m1-ananda-substrate.yml'
  pull_request:
    paths:
      - 'Makefile'
      - 'Body/S/S0/epi-lib/include/m1.h'
      - 'Body/S/S0/epi-lib/include/m1_ananda_projection.h'
      - 'Body/S/S0/epi-lib/include/pointer_web.h'
      - 'Body/S/S0/epi-lib/src/m1.c'
      - 'Body/S/S0/epi-lib/src/m1_ananda_projection.c'
      - 'Body/S/S0/epi-lib/src/pointer_web.c'
      - 'Body/S/S0/epi-lib/test/m1/**'
      - 'Body/S/S0/epi-lib/test/infrastructure/test_pointer_web.c'
      - 'Body/S/S0/portal-core/Cargo.toml'
      - 'Body/S/S0/portal-core/Cargo.lock'
      - 'Body/S/S0/portal-core/src/hopf.rs'
      - 'Body/S/S0/portal-core/src/kernel.rs'
      - 'Body/S/S0/portal-core/src/lib.rs'
      - 'Body/S/S0/portal-core/src/ananda_vortex.rs'
      - 'Body/S/S0/portal-core/src/ananda_music_bridge.rs'
      - 'Body/S/S0/portal-core/src/ananda_ratio_basis.rs'
      - 'Body/S/S0/portal-core/src/ananda_ql_bridge.rs'
      - 'Body/S/S0/portal-core/tests/kernel_clock_projection.rs'
      - 'Body/S/S0/portal-core/tests/ananda_vortex_projection.rs'
      - '.github/workflows/m1-ananda-substrate.yml'

permissions:
  contents: read

env:
  # Existing M3 static assertions use const-array values in _Static_assert.
  # Clang folds them as an extension and -Werror rejects that unrelated baseline.
  # Keep every other strict project warning while exercising the M1 body cut.
  M1_CFLAGS: >-
    -std=c11 -Wall -Wextra -Werror -pedantic -Wno-gnu-folding-constant
    -IBody/S/S0/epi-lib/include -IBody/S/S0/vendor/blake3

jobs:
  c-substrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run M1 and pointer-web regression suites
        run: make test_m1 test_m1_ananda test_m1_ananda_projection test_pointer_web CFLAGS="$M1_CFLAGS"

  rust-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run portal-core temporal and harmonic profile tests
        run: cargo test --manifest-path Body/S/S0/portal-core/Cargo.toml
