name: W2 traversal API fix

on:
  push:
    branches:
      - work/w1-ananda-substrate
    paths:
      - '.github/workflows/w2-api-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/w1-ananda-substrate
      - name: Fix QlPosition Result API and verify portal-core
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Body/S/S0/portal-core/src/ananda_traversal.rs')
          s = p.read_text()
          old = '''        let position = QlPosition::new(self.position6)\n            .ok_or_else(|| format!("traversal position must be 0..5, got {}", self.position6))?;'''
          new = '''        let position = QlPosition::new(self.position6).map_err(|error| {\n            format!(\n                "traversal position must be 0..5, got {}: {error}",\n                self.position6\n            )\n        })?;'''
          if old not in s:
              raise SystemExit('expected traversal conversion block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo test --manifest-path Body/S/S0/portal-core/Cargo.toml
      - name: Commit verified source fix
        run: |
          git config user.name "Epii"
          git config user.email "frank.g.taylor97@gmail.com"
          git add Body/S/S0/portal-core/src/ananda_traversal.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix(m1): adapt W2 traversal to QL position result API"
          git push origin HEAD:work/w1-ananda-substrate
