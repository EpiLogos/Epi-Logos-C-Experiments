name: W2 provenance correction

on:
  push:
    branches:
      - work/w1-ananda-substrate
    paths:
      - '.github/workflows/w2-provenance-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/w1-ananda-substrate
      - name: Correct W2 authority refs and verify portal-core
        run: |
          python - <<'PY'
          from pathlib import Path

          bridge = Path('Body/S/S0/portal-core/src/ananda_ql_bridge.rs')
          s = bridge.read_text()
          s = s.replace(
              'Idea/Bimba/Seeds/M/M1\'/Legacy/plans/M1-C-architecture.md',
              'Idea/Bimba/Seeds/M/M1\'/M1-SPANDA-ANANDA-MUSICAL-DERIVATION-LOCK.md'
          )
          s = s.replace(
              'Idea/Bimba/Seeds/M/M1\'/m1-prime-paramasiva-instrument.md',
              'Idea/Bimba/Seeds/M/M1\'/M1\'-SPEC.md'
          )
          s = s.replace('contains("M1-C-architecture")', 'contains("M1-SPANDA-ANANDA-MUSICAL-DERIVATION-LOCK")')
          s = s.replace('contains("paramasiva-instrument")', 'contains("M1\'-SPEC")')
          bridge.write_text(s)

          traversal = Path('Body/S/S0/portal-core/src/ananda_traversal.rs')
          s = traversal.read_text()
          s = s.replace(
              'Idea/Bimba/Seeds/M/M1\'/m1-prime-paramasiva-instrument.md',
              'Idea/Bimba/Seeds/M/M1\'/M1\'-SPEC.md'
          )
          s = s.replace('contains("paramasiva-instrument")', 'contains("M1\'-SPEC")')
          traversal.write_text(s)
          PY
          cargo test --manifest-path Body/S/S0/portal-core/Cargo.toml
      - name: Commit verified provenance correction
        run: |
          git config user.name "Epii"
          git config user.email "frank.g.taylor97@gmail.com"
          git add Body/S/S0/portal-core/src/ananda_ql_bridge.rs Body/S/S0/portal-core/src/ananda_traversal.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix(m1): ground W2 bridge in current authorities"
          git push origin HEAD:work/w1-ananda-substrate
