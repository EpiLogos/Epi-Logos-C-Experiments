name: W1 profile integration

on:
  push:
    branches:
      - work/w1-ananda-substrate
    paths:
      - '.github/workflows/w1-clock-repair.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: "github.event.head_commit.message == 'chore(w1): execute Ananda profile wire'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/w1-ananda-substrate
      - name: Wire canonical Ananda projection into profile bus
        run: python .github/scripts/w1_profile_wire.py
      - name: Commit profile integration
        run: |
          git config user.name "EpiLogos W1 CI"
          git config user.email "actions@users.noreply.github.com"
          git add Body/S/S0/portal-core
          git commit -m "feat(m1): publish canonical Ananda vortex on profile bus"
          git push origin HEAD:work/w1-ananda-substrate
