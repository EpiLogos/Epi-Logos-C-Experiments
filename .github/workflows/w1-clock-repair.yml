name: W1 clock repair

on:
  push:
    branches:
      - work/w1-ananda-substrate
    paths:
      - '.github/workflows/w1-clock-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: "github.event.head_commit.message == 'chore(w1): execute clock repair'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/w1-ananda-substrate
      - name: Repair Hopf clock ownership and acceptance
        run: python .github/scripts/w1_clock_repair.py
      - name: Commit repaired source
        run: |
          git config user.name "EpiLogos W1 CI"
          git config user.email "actions@users.noreply.github.com"
          git add Body/S/S0/portal-core .github/workflows/m1-ananda-substrate.yml
          git commit -m "fix(m1): separate Hopf fibre from direct-prime walk"
          git push origin HEAD:work/w1-ananda-substrate
